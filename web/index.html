<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quake II — WebAssembly</title>
  <link rel="stylesheet" href="shared-shell/wolfwasm-shell.css">
  <style>
    :root {
      --ww-shell-accent: #c67535;
      --ww-shell-accent-strong: #f2b16b;
      --ww-shell-border: #724827;
      --ww-shell-panel: rgb(15 11 8 / 96%);
      --ww-shell-field: #18110c;
    }
    #launcher-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    #launcher-actions #play { grid-column: 1 / -1; }
    #loading-overlay { z-index: 30; }
    #loading-overlay [data-shell-card] { width: min(48rem, 94vw) !important; }
    [data-shell-canvas] { cursor: default; }
    @media (max-width: 560px) {
      #launcher-actions { grid-template-columns: 1fr; }
      #launcher-actions #play { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <section id="launcher" data-shell-launcher>
      <div data-shell-card>
        <p data-shell-kicker>id Tech 2</p>
        <h1 data-shell-title>Quake II</h1>
        <p>Play Quake II in your browser. The container stores your legally
          owned PAKs once; this browser also caches them for fast reloads.</p>

        <label data-shell-identity>Player name
          <input id="player-name" data-shell-player-name maxlength="32" autocomplete="nickname" value="Ranger">
        </label>

        <details data-shell-advanced>
          <summary>Advanced settings</summary>
          <div data-shell-graphics>
            <label>Graphics ceiling
              <select id="quality" data-shell-quality-profile>
                <option value="medium">Medium</option>
                <option value="high" selected>High</option>
                <option value="ultra">Ultra</option>
              </select>
            </label>
            <label>Frame-rate target
              <select id="fps" data-shell-target-fps>
                <option value="30">30 FPS</option>
                <option value="60" selected>60 FPS</option>
                <option value="120">120 FPS</option>
              </select>
            </label>
            <label><span><input id="dynamic" data-shell-dynamic-quality type="checkbox" checked> Dynamic quality</span></label>
          </div>
        </details>

        <div id="launcher-actions">
          <label data-shell-setup-token-field hidden>Container setup token
            <input data-shell-setup-token type="password" autocomplete="off">
          </label>
          <button id="choose-folder" data-shell-provisioning type="button" disabled>Install from baseq2 folder</button>
          <button id="choose-files" data-shell-provisioning type="button" disabled>Install PAK files</button>
          <button id="forget-data" data-shell-data-ready type="button" disabled>Clear browser cache</button>
          <button id="play" type="button" disabled>Play Quake II</button>
        </div>
        <p id="status" data-shell-status role="status">Loading Quake II engine gate…</p>
        <p id="data-error" data-shell-error role="alert"></p>
      </div>
    </section>

    <section id="runtime" data-shell-runtime hidden>
      <canvas id="canvas" data-shell-canvas width="1280" height="720" tabindex="0" aria-label="Quake II game canvas"></canvas>
      <div id="loading-overlay" data-shell-overlay hidden>
        <div data-shell-card="wide">
          <p data-shell-kicker>Quake II</p>
          <h1 data-shell-title>Starting game</h1>
          <p id="loading-status" data-shell-status>Preparing engine…</p>
          <pre id="console" data-shell-console aria-label="Quake II startup console"></pre>
        </div>
      </div>
    </section>

    <input id="folder-fallback" type="file" webkitdirectory multiple hidden>
    <input id="files-fallback" type="file" accept=".pak,.PAK" multiple hidden>
  </main>

  <script src="shared-shell/wolfwasm-shell.js"></script>
  <script>
  (() => {
    'use strict';

    const PAKS = Object.freeze([
      Object.freeze({ key: 'pak0.pak', names: ['pak0.pak', 'PAK0.PAK'], mountName: 'pak0.pak', size: 183997730, sha256: '1ce99eb11e7e251ccdf690858effba79836dbe5e32a4083ad00a13ecda491679' }),
      Object.freeze({ key: 'pak1.pak', names: ['pak1.pak', 'PAK1.PAK'], mountName: 'pak1.pak', size: 12992754, sha256: '678210ecd1b27dde1c645660333a1a7b139d849425793859657f804d379b62ad' }),
      Object.freeze({ key: 'pak2.pak', names: ['pak2.pak', 'PAK2.PAK'], mountName: 'pak2.pak', size: 45055, sha256: 'cb88d584ef939d08e24433a6cf86274737303fac2bbd94415927a75e6b269dd8' })
    ]);

    const canvas = document.querySelector('#canvas');
    const statusView = document.querySelector('#status');
    const errorView = document.querySelector('#data-error');
    const loadingOverlay = document.querySelector('#loading-overlay');
    const loadingStatus = document.querySelector('#loading-status');
    const consoleView = document.querySelector('#console');
    const folderButton = document.querySelector('#choose-folder');
    const filesButton = document.querySelector('#choose-files');
    const forgetButton = document.querySelector('#forget-data');
    const playButton = document.querySelector('#play');
    const playerName = document.querySelector('#player-name');
    const qualitySelect = document.querySelector('#quality');
    const fpsSelect = document.querySelector('#fps');
    const dynamicToggle = document.querySelector('#dynamic');
    const folderFallback = document.querySelector('#folder-fallback');
    const filesFallback = document.querySelector('#files-fallback');

    let preparedData = null;
    let busy = false;
    let engineModule = null;
    let resizeTimer = 0;
    let nextNativeResize = 0;
    let reportedState = '';
    let qualityController = null;

    function nativeRuntimeState() {
      if (!engineModule || typeof engineModule._Q2Web_RuntimeState !== 'function') return 'menu';
      return ['menu', 'gameplay', 'paused'][engineModule._Q2Web_RuntimeState()] || 'menu';
    }

    const shell = WolfWasmShell.configure({
      launcher: '#launcher',
      runtime: '#runtime',
      canvas,
      displayMode: 'dynamic',
      pixelated: false,
      graphics: true,
      identity: true,
      advanced: true,
      maxDpr: 2,
      pointerLock: true,
      readEngineState: nativeRuntimeState,
      onCaptureLost() {
        if (!engineModule) return;
        engineModule._Q2Web_SetInputCaptured(0);
        engineModule._Q2Web_EnsureMenu();
      },
      onNativeResizeRequest(detail) {
        if (!engineModule || typeof engineModule._Q2Web_ResizeViewport !== 'function') return;
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          engineModule?._Q2Web_ResizeViewport(detail.requestedWidth, detail.requestedHeight);
        }, 250);
      },
      preferences: {
        namespace: 'quake2',
        playerName: '#player-name',
        qualityProfile: '#quality',
        targetFps: '#fps',
        dynamicQuality: '#dynamic',
        defaults: { playerName: 'Ranger', qualityProfile: 'high', targetFps: 60, dynamicQuality: true }
      }
    });
    const cache = WolfWasmShell.createDataCache({
      namespace: 'quake2-registered',
      version: 'retail-paks-v1'
    });
    const ownerData = WolfWasmShell.createOwnerDataSet({
      cache,
      files: PAKS.map(spec => ({
        key: spec.key,
        cacheKey: spec.key,
        names: spec.names,
        mountName: spec.mountName,
        size: spec.size,
        magic: 'PACK',
        validate: file => validateDigest(file, spec)
      }))
    });

    const containerData = WolfWasmShell.createContainerDataClient();

    function setBusy(value) {
      busy = value;
      folderButton.disabled = value;
      filesButton.disabled = value;
      forgetButton.disabled = value || !preparedData;
      playButton.disabled = value || !preparedData;
      playerName.disabled = value;
    }

    function message(value, error = false) {
      statusView.textContent = value;
      errorView.textContent = error ? value : '';
    }

    function appendLog(value) {
      const line = String(value || '');
      if (!line) return;
      consoleView.textContent += `${line}\n`;
      consoleView.scrollTop = consoleView.scrollHeight;
    }

    async function sha256Hex(file) {
      if (!crypto?.subtle) throw new Error('SHA-256 verification requires HTTPS or localhost.');
      const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
      return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
    }

    async function validateDigest(file, spec) {
      message(`Verifying ${spec.mountName}…`);
      if (await sha256Hex(file) !== spec.sha256) throw new Error(`${spec.mountName} failed SHA-256 verification.`);
    }

    async function prepare(source, label) {
      if (busy || engineModule) return;
      setBusy(true);
      errorView.textContent = '';
      try {
        if (source) await containerData.provision(source, {
          onProgress(detail) { message(`Installing ${detail.key} in this container…`); }
        });
        await containerData.applyGate();
        preparedData = await containerData.load(ownerData, {
          onProgress(detail) {
            if (detail.phase === 'checking-cache') message(`Checking private browser cache for ${detail.key}…`);
            if (detail.phase === 'downloading') {
              const percent = detail.total ? Math.floor(detail.received * 100 / detail.total) : 0;
              message(`Caching ${detail.key} from this container… ${percent}%`);
            }
            if (detail.phase === 'restored') message(`Restored ${detail.key} from this browser…`);
            if (detail.phase === 'cached') message(`Cached ${detail.key} for future visits…`);
          }
        });
        const restored = preparedData.entries.every(entry => entry.cached);
        document.documentElement.dataset.wasmDataSource = restored ? 'cache' : label;
        message(restored
          ? 'Quake II data restored from this browser. Ready to play.'
          : 'Quake II data downloaded from this container and cached. Ready to play.');
      } catch (error) {
        preparedData = null;
        message(error instanceof Error ? error.message : String(error), error?.code !== 'OWNER_DATA_MISSING');
      } finally {
        setBusy(false);
      }
    }

    function inputSelection(input, label) {
      input.value = '';
      input.onchange = () => {
        if (input.files?.length) prepare(Array.from(input.files), label);
      };
      input.click();
    }

    folderButton.addEventListener('click', async () => {
      if (!window.showDirectoryPicker) return inputSelection(folderFallback, 'folder');
      try {
        await prepare(await window.showDirectoryPicker({ mode: 'read' }), 'folder');
      } catch (error) {
        if (error?.name !== 'AbortError') message(error instanceof Error ? error.message : String(error), true);
      }
    });

    filesButton.addEventListener('click', async () => {
      if (!window.showOpenFilePicker) return inputSelection(filesFallback, 'files');
      try {
        const handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{ description: 'Quake II PAK files', accept: { 'application/octet-stream': ['.pak', '.PAK'] } }]
        });
        await prepare(await Promise.all(handles.map(handle => handle.getFile())), 'files');
      } catch (error) {
        if (error?.name !== 'AbortError') message(error instanceof Error ? error.message : String(error), true);
      }
    });

    forgetButton.addEventListener('click', async () => {
      if (busy || engineModule) return;
      setBusy(true);
      try {
        await ownerData.clear();
        preparedData = null;
        document.documentElement.dataset.wasmDataSource = 'none';
        message('Browser cache cleared. Restoring from this container…');
      } catch (error) {
        message(error instanceof Error ? error.message : String(error), true);
      } finally {
        setBusy(false);
      }
      if (!preparedData) await prepare(null, 'container');
    });

    function safeName() {
      const value = playerName.value.replace(/[^A-Za-z0-9 _-]/g, '').trim().slice(0, 32) || 'Ranger';
      playerName.value = value;
      shell.preferences?.save();
      return value;
    }

    function browserViewport() {
      const viewport = window.visualViewport;
      return {
        width: Math.max(640, Math.min(8192, Math.round(viewport ? viewport.width : window.innerWidth))),
        height: Math.max(360, Math.min(8192, Math.round(viewport ? viewport.height : window.innerHeight)))
      };
    }

    function graphicsArguments(profile, fps, viewport) {
      const profiles = {
        medium: ['+set', 'r_msaa_samples', '0', '+set', 'r_anisotropic', '2', '+set', 'r_shadows', '0', '+set', 'cl_particles', '0', '+set', 'cl_lights', '0'],
        high: ['+set', 'r_msaa_samples', '2', '+set', 'r_anisotropic', '8', '+set', 'r_shadows', '0', '+set', 'cl_particles', '1', '+set', 'cl_lights', '1'],
        ultra: ['+set', 'r_msaa_samples', '4', '+set', 'r_anisotropic', '16', '+set', 'r_shadows', '1', '+set', 'cl_particles', '1', '+set', 'cl_lights', '1']
      };
      return [
        '+set', 'vid_renderer', 'gles3',
        '+set', 'vid_fullscreen', '0',
        '+set', 'r_mode', '-1',
        '+set', 'r_customwidth', String(viewport.width),
        '+set', 'r_customheight', String(viewport.height),
        '+set', 'vid_maxfps', String(fps),
        '+set', 'horplus', '1',
        '+set', 'in_grab', '2',
        ...(profiles[profile] || profiles.high)
      ];
    }

    function startDynamicQuality(module, ceilingName, targetFps) {
      const levels = { medium: 0, high: 1, ultra: 2 };
      const profiles = ceilingName === 'ultra' ? ['ultra', 'high', 'medium'] :
        ceilingName === 'high' ? ['high', 'medium'] : ['medium'];
      qualityController?.stop();
      qualityController = WolfWasmShell.createQualityController({
        profiles,
        targetFps,
        enabled: true,
        apply(name, detail) {
          module._Q2Web_ApplyQuality(levels[name]);
          globalThis.__quake2Quality = { level: levels[name], name, targetFps, reason: detail.reason };
        },
        onSample(detail) {
          document.documentElement.dataset.quake2MeasuredFps = detail.fps.toFixed(1);
        }
      });
      qualityController.start();
    }

    async function loadEngineScript() {
      if (globalThis.createQuake2Module) return;
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'quake2.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('Could not load quake2.js.'));
        document.head.append(script);
      });
    }

    playButton.addEventListener('click', async () => {
      if (busy || !preparedData || engineModule) return;
      setBusy(true);
      const name = safeName();
      const profile = qualitySelect.value;
      const fps = fpsSelect.value;
      const dynamic = dynamicToggle.checked;
      const viewport = browserViewport();
      consoleView.textContent = '';
      loadingOverlay.hidden = false;
      shell.showRuntime();
      await shell.resumeAudio();
      try {
        await loadEngineScript();
        engineModule = await createQuake2Module({
          canvas,
          quake2OwnerData: preparedData,
          arguments: ['-datadir', '/data', '+set', 'name', name, ...graphicsArguments(profile, fps, viewport)],
          print(value) { console.log('[Quake II WASM]', value); appendLog(value); },
          printErr(value) { console.error('[Quake II WASM]', value); appendLog(`ERROR: ${value}`); },
          setStatus(value) { if (value) loadingStatus.textContent = value; appendLog(value); },
          onAssetError(error) { throw error; }
        });
        loadingOverlay.hidden = true;
        shell.resize();
        reportedState = nativeRuntimeState();
        shell.setEngineState(reportedState);
        if (dynamic) startDynamicQuality(engineModule, profile, Number(fps));
        window.setInterval(() => {
          if (typeof engineModule._Q2Web_AudioCallbacks !== 'function') return;
          document.documentElement.dataset.quake2Audio = [
            engineModule._Q2Web_AudioCallbacks(),
            engineModule._Q2Web_AudioNonzeroCallbacks()
          ].join(',');
          if (typeof engineModule._Q2Web_ControlsMask === 'function') {
            const mask = engineModule._Q2Web_ControlsMask();
            document.documentElement.dataset.quake2ControlsMask = String(mask);
            document.documentElement.dataset.quake2ControlsValid = String(mask === 255);
          }
          if (typeof engineModule._Q2Web_RenderWidth === 'function') {
            const renderWidth = engineModule._Q2Web_RenderWidth();
            const renderHeight = engineModule._Q2Web_RenderHeight();
            document.documentElement.dataset.quake2RenderSize = [
              renderWidth,
              renderHeight
            ].join('x');
            const viewport = browserViewport();
            if (typeof engineModule._Q2Web_ResizeViewport === 'function' &&
                (renderWidth !== viewport.width || renderHeight !== viewport.height) &&
                performance.now() >= nextNativeResize) {
              nextNativeResize = performance.now() + 750;
              engineModule._Q2Web_ResizeViewport(viewport.width, viewport.height);
            }
          }
          if (typeof engineModule._Q2Web_ViewWidth === 'function') {
            document.documentElement.dataset.quake2View = [
              engineModule._Q2Web_ViewWidth(),
              engineModule._Q2Web_ViewHeight(),
              engineModule._Q2Web_FovX100() / 100,
              engineModule._Q2Web_FovY100() / 100
            ].join(',');
          }
          const nextState = nativeRuntimeState();
          if (nextState !== reportedState) {
            reportedState = nextState;
            shell.setEngineState(nextState);
            engineModule._Q2Web_SetInputCaptured(shell.inputCaptured() ? 1 : 0);
          }
        }, 250);
      } catch (error) {
        engineModule = null;
        loadingOverlay.hidden = true;
        shell.showLauncher();
        message(`Startup failed: ${error instanceof Error ? error.message : String(error)}`, true);
        setBusy(false);
      }
    });

    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('click', async () => {
      if (!engineModule) return;
      canvas.focus();
      await shell.resumeAudio();
    });
    document.addEventListener('pointerlockchange', () => {
      const captured = document.pointerLockElement === canvas;
      document.documentElement.dataset.inputCaptured = String(captured);
      if (!engineModule) return;
      engineModule._Q2Web_SetInputCaptured(captured ? 1 : 0);
    });

    (async () => {
      setBusy(false);
      message('Checking this container and browser for Quake II data…');
      try {
        const state = await containerData.applyGate();
        if (state.ready) await prepare(null, 'container');
        else message('Install the required Quake II PAKs in this container once.');
      } catch (error) {
        message(error instanceof Error ? error.message : String(error), true);
      }
    })();
  })();
  </script>
</body>
</html>
